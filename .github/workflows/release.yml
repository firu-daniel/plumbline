name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Opens (or updates) a version pull request while changesets are pending,
      # and publishes once that pull request is merged.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          # Publishing needs the registry token. Until that secret exists the
          # action still opens and maintains the version pull request, which is
          # the half of the release flow that does not need credentials.
          publish: ${{ secrets.NPM_TOKEN != '' && 'npm run release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `changeset publish` tags each published version in the runner's clone,
      # and changesets/action@v1 is supposed to push those tags and open a
      # GitHub release per tag. It does neither here: it recognises a publish by
      # parsing the CLI's stdout, and changesets 3's renderer no longer prints
      # the line that parser looks for, so the action concludes nothing was
      # published. 0.1.0 reached npm with no tag behind it because of exactly
      # that. Pushing whatever tags the step left behind costs one line and does
      # not care whether the parser ever catches up.
      - name: Push the tags the publish created
        run: git push origin --tags
